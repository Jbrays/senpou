name: Publish extension repo

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "lib-multisrc/**"
      - "lib/**"
      - "core/**"
      - "compiler/**"
      - "gradle/**"
      - "scripts/**"
      - ".github/workflows/publish-repo.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Prepare signing key
        env:
          SIGNING_KEY_BASE64: ${{ secrets.SIGNING_KEY_BASE64 }}
        run: |
          if [ -z "$SIGNING_KEY_BASE64" ]; then
            echo "SIGNING_KEY_BASE64 secret is required" >&2
            exit 1
          fi
          echo "$SIGNING_KEY_BASE64" | base64 -d > signingkey.jks

      - name: Build release extensions
        env:
          ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew \
            :src:es:manhwalatino:assembleRelease \
            :src:es:manhwaes:assembleRelease \
            :src:es:topcomicporno:assembleRelease \
            :src:es:ikigaimangas:assembleRelease

      - name: Generate repo index
        env:
          ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
        run: |
          FP=$(keytool -list -v -keystore signingkey.jks -storepass "$KEY_STORE_PASSWORD" -alias "$ALIAS" 2>/dev/null \
            | python3 -c "import sys,re; t=sys.stdin.read(); m=re.search(r'SHA256:\s*([0-9A-Fa-f:]+)', t); print(m.group(1).replace(':','').lower() if m else '')")
          python3 scripts/generate-repo-index.py \
            --github-user "${{ github.repository_owner }}" \
            --github-repo "${{ github.event.repository.name }}" \
            --branch repo \
            --signing-key-fingerprint "$FP"

      - name: Publish repo branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BRANCH=repo
          # orphan-style replace
          rm -rf /tmp/senpou-repo
          mkdir -p /tmp/senpou-repo
          cp -a repo/. /tmp/senpou-repo/
          git fetch origin "$BRANCH" 2>/dev/null || true
          if git show-ref --verify --quiet "refs/remotes/origin/$BRANCH"; then
            git checkout -B "$BRANCH" "origin/$BRANCH"
          else
            git checkout --orphan "$BRANCH"
          fi
          find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          cp -a /tmp/senpou-repo/. .
          git add -A
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update extension repo"
            git push origin "HEAD:$BRANCH"
          fi

      - name: Cleanup keystore
        if: always()
        run: rm -f signingkey.jks
